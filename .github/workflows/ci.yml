name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel stale runs on the same ref — only the latest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — fmt / vet / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: isppr
          POSTGRES_PASSWORD: isppr
          POSTGRES_DB: isppr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U isppr -d isppr"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://isppr:isppr@localhost:5432/isppr?sslmode=disable
      S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./cmd/... ./internal/...
      - run: go build ./cmd/... ./internal/...
      - name: Start MinIO
        # A plain docker run — service containers can't override the image
        # command, and this community build needs `server /data`.
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/coollabsio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && exit 0 || sleep 2
          done
          docker logs minio; exit 1
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./cmd/... ./internal/...
      - name: go test (coverage)
        # -coverpkg scopes attribution to the source trees so tests that call
        # sibling packages count those statements too.
        run: |
          coverpkg=$(go list -f '{{.ImportPath}}' ./cmd/... ./internal/... | tr '\n' ',' | sed 's/,$//')
          go test -count=1 -timeout 10m -coverprofile=coverage.out -coverpkg="$coverpkg" . ./cmd/... ./internal/...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: coverage floor (80%/area)
        run: node tools/covercheck.mjs coverage.out
      - name: e2e — pipeline suite (live stack)
        # Gotenberg + a seeded `go run` api over the postgres/minio already
        # up — real HTTP against the same binaries the unit suite exercised.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ghostscript >/dev/null
          docker run -d --name gotenberg -p 3000:3000 gotenberg/gotenberg:8
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 2
          done
          GOTENBERG_URL=http://localhost:3000 \
            STORAGE_BACKEND=s3 S3_PUBLIC_ENDPOINT=http://localhost:9100 \
            RUN_SEED=1 PORT=8090 \
            nohup go run ./cmd/dge-api > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/healthz && break || sleep 2
          done
          curl -sf http://localhost:8090/healthz || { cat api.log; exit 1; }
          go test -count=1 -timeout 5m -v ./e2e/...
      - name: Upload Go coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 2

  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: coverage floor (80%/area)
        working-directory: .
        run: node tools/covercheck.mjs clients/web/coverage/lcov.info
      - run: npm run build
      - name: Upload web coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-coverage
          path: clients/web/coverage/lcov.info
          retention-days: 2

  e2e:
    name: e2e — Playwright portal + API suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: isppr
          POSTGRES_PASSWORD: isppr
          POSTGRES_DB: isppr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U isppr -d isppr"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://isppr:isppr@localhost:5432/isppr?sslmode=disable
      S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/coollabsio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && exit 0 || sleep 2
          done
          docker logs minio; exit 1
      - name: Start Gotenberg + seeded api
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ghostscript >/dev/null
          docker run -d --name gotenberg -p 3000:3000 gotenberg/gotenberg:8
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 2
          done
          GOTENBERG_URL=http://localhost:3000 \
            STORAGE_BACKEND=s3 S3_PUBLIC_ENDPOINT=http://localhost:9100 \
            CORS_ORIGIN=http://localhost:3100 \
            RUN_SEED=1 PORT=8090 \
            nohup go run ./cmd/dge-api > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/healthz && break || sleep 2
          done
          curl -sf http://localhost:8090/healthz || { cat api.log; exit 1; }
      - name: Web build + start
        working-directory: clients/web
        run: |
          npm ci
          npm run build
          NEXT_PUBLIC_API_URL=http://localhost:8090 nohup npm start -- -p 3100 > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login > /dev/null && break || sleep 2
          done
          curl -sf http://localhost:3100/login > /dev/null || { cat web.log; exit 1; }
      - name: Playwright browsers
        working-directory: clients/web
        run: npx playwright install --with-deps chromium
      - name: Playwright suite
        working-directory: clients/web
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_API_URL: http://localhost:8090
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            clients/web/playwright-report/
            clients/web/test-results/
          retention-days: 2

  sonarqube:
    name: SonarQube — scan + quality gate
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame + new-code detection need history
      - name: Download Go coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-coverage
      - name: Download web coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-coverage
          path: clients/web/coverage
      - name: Start SonarQube
        # Self-hosted instance inside the job — no secrets, fully
        # reproducible, and the quality gate is queryable in the same run.
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community
          for i in $(seq 1 90); do
            s=$(curl -sf http://localhost:9000/api/system/status | grep -o '"status":"[A-Z_]*"' | cut -d'"' -f4 || true)
            [ "$s" = "UP" ] && exit 0
            [ "$s" = "DOWN" -o "$s" = "DB_MIGRATION_NEEDED" ] && { docker logs sonarqube --tail 50; exit 1; }
            sleep 4
          done
          docker logs sonarqube --tail 80; exit 1
      - name: Scanner token
        # Default admin/admin is valid until changed; mint a token for the
        # scanner rather than passing credentials to it.
        run: |
          token=$(curl -sf -u admin:admin \
            -X POST http://localhost:9000/api/user_tokens/generate?name=ci \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          [ -n "$token" ] || { echo "token generation failed"; exit 1; }
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Scan
        run: >
          docker run --rm --network host
          -e SONAR_TOKEN=$SONAR_TOKEN
          -e SONAR_HOST_URL=http://localhost:9000
          -v "$PWD:/usr/src"
          sonarsource/sonar-scanner-cli
      - name: Quality gate
        run: |
          # Analysis is async — wait for the compute-engine task, then gate.
          for i in $(seq 1 30); do
            st=$(curl -sf -u "$SONAR_TOKEN:" \
              "http://localhost:9000/api/qualitygates/project_status?projectKey=isppr" \
              | grep -o '"status":"[A-Z_]*"' | head -1 | cut -d'"' -f4 || true)
            [ -n "$st" ] && break
            sleep 2
          done
          echo "quality gate: ${st:-unknown}"
          [ "$st" != "ERROR" ] || exit 1
