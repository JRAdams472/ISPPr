name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel stale runs on the same ref — only the latest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — fmt / vet / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: isppr
          POSTGRES_PASSWORD: isppr
          POSTGRES_DB: isppr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U isppr -d isppr"
          --health-interval 5s --health-timeout 3s --health-retries 12
      minio:
        # Same community build as docker-compose (Docker Hub dropped minio).
        image: ghcr.io/coollabsio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9100:9000"]
        options: >-
          --health-cmd "mc ready local || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://isppr:isppr@localhost:5432/isppr?sslmode=disable
      S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./cmd/... ./internal/...
      - run: go build ./cmd/... ./internal/...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./cmd/... ./internal/...
      - name: go test (coverage)
        # -coverpkg scopes attribution to the source trees so tests that call
        # sibling packages count those statements too.
        run: |
          coverpkg=$(go list -f '{{.ImportPath}}' ./cmd/... ./internal/... | tr '\n' ',' | sed 's/,$//')
          go test -count=1 -timeout 10m -coverprofile=coverage.out -coverpkg="$coverpkg" . ./cmd/... ./internal/...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: coverage floor (80%/area)
        run: node tools/covercheck.mjs coverage.out
      - name: Upload Go coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 2

  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: coverage floor (80%/area)
        working-directory: .
        run: node tools/covercheck.mjs clients/web/coverage/lcov.info
      - run: npm run build
      - name: Upload web coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-coverage
          path: clients/web/coverage/lcov.info
          retention-days: 2
