services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: isppr
      POSTGRES_PASSWORD: isppr
      POSTGRES_DB: isppr
    ports: ["5433:5432"]
    # postgres:18+ expects the mount at /var/lib/postgresql (PGDATA moves to
    # a versioned subdir); mounting .../data directly aborts startup.
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isppr -d isppr"]
      interval: 5s
      timeout: 3s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  minio:
    # MinIO is source-only now (Docker Hub removed, quay.io gated). This is
    # the community source-build continuation — dev-only S3 stand-in.
    image: ghcr.io/coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9100:9000", "9101:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6

  api:
    build: .
    env_file: .env
    environment:
      PORT: "8090"
      DATABASE_URL: postgres://isppr:isppr@db:5432/isppr?sslmode=disable
      GOTENBERG_URL: http://gotenberg:3000
      S3_ENDPOINT: http://minio:9000
      CORS_ORIGIN: http://localhost:3100
      RUN_SEED: "1" # dev demo tenant (cli_demo / cust_demo); unset in prod
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
      minio:
        condition: service_started

  web:
    build: clients/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090
    ports: ["3100:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  minio-data:
