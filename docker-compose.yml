services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: isppr
      POSTGRES_PASSWORD: isppr
      POSTGRES_DB: isppr
    ports: ["5433:5432"]
    # postgres:18+ expects the mount at /var/lib/postgresql (PGDATA moves to
    # a versioned subdir); mounting .../data directly aborts startup.
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isppr -d isppr"]
      interval: 5s
      timeout: 3s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  minio:
    # MinIO is source-only now (Docker Hub removed, quay.io gated). This is
    # the community source-build continuation — dev-only S3 stand-in.
    image: ghcr.io/coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9100:9000", "9101:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Observability (MPE-44): traces → Jaeger (OTLP/gRPC :4317, UI :16686),
  # structured logs → Seq (OTLP/HTTP :5341, UI/API :5341). The api service
  # only exports when the OTEL_* env vars below are set — remove them and
  # the api runs exporter-free.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # dev stack — no Seq login
    ports: ["5341:80"] # UI + API on 5341; ingestion stays internal (:5341)

  api:
    build: .
    env_file: .env
    environment:
      PORT: "8090"
      DATABASE_URL: postgres://isppr:isppr@db:5432/isppr?sslmode=disable
      GOTENBERG_URL: http://gotenberg:3000
      S3_ENDPOINT: http://minio:9000
      PRINT_GS_PATH: gs
      PRINT_ICC_PROFILE: default_cmyk.icc
      PRINT_PDFX: "true"
      PRINT_TIMEOUT_MS: "20000"
      S3_PUBLIC_ENDPOINT: http://localhost:9100 # presigned URLs resolve for the host
      CORS_ORIGIN: http://localhost:3100
      RUN_SEED: "1" # dev demo tenant (cli_demo / cust_demo); unset in prod
      STORAGE_BACKEND: s3 # artifacts land in MinIO + presigned downloads (MPE-36)
      STORAGE_LOCAL_DIR: /data/docs # only used when STORAGE_BACKEND=local
      OTEL_SERVICE_NAME: isppr
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317 # traces → Jaeger
      OTEL_LOGS_ENDPOINT: http://seq:5341/ingest/otlp # structured logs → Seq
    tmpfs: [/data/docs] # writable by the non-root app; artifacts are dev-ephemeral
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
      minio:
        condition: service_started
      jaeger:
        condition: service_started
      seq:
        condition: service_started

  web:
    build: clients/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090
    ports: ["3100:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  minio-data:
