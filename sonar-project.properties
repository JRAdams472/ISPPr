sonar.projectKey=isppr
sonar.projectName=ISPPr
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/bin/**,**/.next/**,**/coverage/**,**/dist/**,**/out/**,**/playwright-report/**,**/test-results/**,**/package-lock.json,**/go.sum

sonar.tests=clients/web/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*_test.go

sonar.javascript.lcov.reportPaths=clients/web/coverage/lcov.info
