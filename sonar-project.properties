sonar.projectKey=isppr
sonar.projectName=ISPPr
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/bin/**,**/.next/**,**/coverage/**,**/dist/**,**/out/**,**/playwright-report/**,**/test-results/**,**/package-lock.json,**/go.sum

sonar.tests=clients/web/__tests__,clients/web/e2e,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=clients/web/coverage/lcov.info
